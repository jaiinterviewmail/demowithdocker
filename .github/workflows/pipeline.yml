name: AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'

    - name: Build
      run: mvn clean package

    - name: Run Tests
      run: mvn test

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Login to ECR
      run: aws ecr get-login-password ...

    - name: Build Image
      run: docker build -t app .

    - name: Push Image
      run: docker push <ECR_REPO>

  terraform:
    needs: docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Terraform Init
      run: terraform init ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve ./terraform
