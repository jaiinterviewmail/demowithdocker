name: AI CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
   

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'

    - name: Build
      run: mvn clean package

    - name: Run Tests
      run: mvn test

  
